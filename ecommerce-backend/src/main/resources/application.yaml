  server:
    port: ${SERVER_PORT:8080}

  spring:
    application:
      name: ecommerce-backend

    web:
      error:
        include-message: ALWAYS
        include-binding-errors: ALWAYS
        include-stacktrace: ALWAYS
        include-exception: true

    datasource:
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      username: ${DB_USERNAME:ecommerce}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          format_sql: true
      show-sql: true

    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DATABASE:ecommerce}
      username: ${MONGO_USERNAME:root}
      password: ${MONGO_PASSWORD}
      authentication-database: ${MONGO_AUTH_SOURCE:admin}

    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db/migration

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 20MB

    mail:
      host: ${SMTP_HOST:smtp.gmail.com}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME}
      password: ${SMTP_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
              required: true
            connectiontimeout: 5000
            timeout: 5000
            writetimeout: 5000

    security:
      oauth2:
        client:
          registration:
            google:
              client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
              client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
              scope:
                - openid
                - profile
                - email
          provider:
            google:
              issuer-uri: https://accounts.google.com

  app:
    upload:
      dir: ${UPLOAD_DIR:./uploads}

    security:
      jwt:
        issuer: ${JWT_ISSUER:ecommerce-backend}
        access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
        refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
        secret-base64: ${JWT_SECRET_BASE64}

      oauth2:
        success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/oauth2/callback}

    payment:
      vnpay:
        tmn-code: ${VNPAY_TMN_CODE}
        hash-secret: ${VNPAY_HASH_SECRET}
        url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
        return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay/callback}
        version: ${VNPAY_VERSION:2.1.0}
        command: ${VNPAY_COMMAND:pay}

    email:
      from: ${EMAIL_FROM:noreply@ecommerce.com}
      from-name: ${EMAIL_FROM_NAME:E-Commerce Platform}

  springdoc:
    swagger-ui:
      path: /swagger-ui
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info
    endpoint:
      health:
        show-details: always

  logging:
    level:
      "[org.springdoc]": DEBUG
      "[org.springframework.web]": DEBUG
      "[org.springframework.security]": DEBUG
      "[org.flywaydb]": INFO
      "[org.springframework.boot.autoconfigure.flyway]": INFO
