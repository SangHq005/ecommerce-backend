server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

spring:
  application:
    name: ecommerce-backend
  profiles:
    active: dev # Default profile
  main:
    allow-bean-definition-overriding: true

  web:
    error:
      include-message: ALWAYS
      include-binding-errors: ALWAYS
      include-stacktrace: ALWAYS
      include-exception: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: ${OAUTH2_GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
            authorization-grant-type: authorization_code
        provider:
          google:
            issuer-uri: https://accounts.google.com
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}

  cors:
    # CORS allowed origins - comma-separated list
    # Set via environment variable: APP_CORS_ALLOWED_ORIGINS=https://app.example.com,https://admin.example.com
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173,http://localhost:3001}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
    exposed-headers: Authorization,X-Correlation-ID,X-Total-Count

  security:
    jwt:
      issuer: ${JWT_ISSUER:ecommerce-backend}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
      secret-base64: ${JWT_SECRET_BASE64}

    oauth2:
      success-redirect-url: ${OAUTH2_SUCCESS_REDIRECT_URL:http://localhost:3000/oauth2/callback}

  payment:
      vnpay:
        mock: ${VNPAY_MOCK:true}
        tmn-code: ${VNPAY_TMN_CODE:MOCK_TMN_CODE}
        hash-secret: ${VNPAY_HASH_SECRET:MOCK_HASH_SECRET}
        url: ${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
        return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payment/vnpay/callback}
        version: ${VNPAY_VERSION:2.1.0}
        command: ${VNPAY_COMMAND:pay}
        frontend-url: ${VNPAY_FRONTEND_URL:http://localhost:3000}

      momo:
        partner-code: ${MOMO_PARTNER_CODE:MOMO}
        access-key: ${MOMO_ACCESS_KEY:MOMO_ACCESS_KEY}
        secret-key: ${MOMO_SECRET_KEY:MOMO_SECRET_KEY}
        endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
        return-url: ${MOMO_RETURN_URL:http://localhost:3000/payment/momo/result}
        ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/v1/payment/momo/callback}

  email:
    from: ${EMAIL_FROM:noreply@ecommerce.com}
    from-name: ${EMAIL_FROM_NAME:E-Commerce Platform}

  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      timeout-seconds: ${GROQ_TIMEOUT_SECONDS:30}

  order:
    shipping-fee-default: ${ORDER_SHIPPING_FEE:30000}
    currency-default: ${ORDER_CURRENCY:VND}

springdoc:
  swagger-ui:
    path: /swagger-ui
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

cloud:
  storage:
    provider: ${CLOUD_STORAGE_PROVIDER:cloudinary}  # local, cloudinary
    # Cloudinary config (get from https://cloudinary.com/console)
    cloudinary-cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    cloudinary-api-key: ${CLOUDINARY_API_KEY:}
    cloudinary-api-secret: ${CLOUDINARY_API_SECRET:}
    # Common config
    upload-dir: uploads
    max-file-size: 10485760  # 10MB
