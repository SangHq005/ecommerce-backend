# Production configuration
# All sensitive values should be provided via environment variables

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  mongodb:
    uri: ${MONGO_URI}

  # Disable detailed error messages in production
  web:
    error:
      include-message: NEVER
      include-binding-errors: NEVER
      include-stacktrace: NEVER
      include-exception: false

# CORS configuration - MUST be set for production
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allow-credentials: true
    max-age: 3600

  security:
    jwt:
      issuer: ${JWT_ISSUER}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
      secret-base64: ${JWT_SECRET_BASE64}

  payment:
    vnpay:
      mock: false
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      url: ${VNPAY_URL}
      return-url: ${VNPAY_RETURN_URL}

# Disable Swagger in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Production logging
logging:
  level:
    root: WARN
    "[com.example.ecommerce]": INFO
    "[org.springframework.web]": WARN
    "[org.springframework.security]": WARN
    "[org.hibernate.SQL]": WARN
    "[org.hibernate.orm.jdbc.bind]": WARN

# Restrict actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
